<h1>ReachInbox Simple</h1>
<input id="to" placeholder="To Email">
<input id="subject" placeholder="Subject">
<button onclick="send()">Send</button>
<div id="list"></div>

<script>
async function send(){
  await fetch('http://localhost:4000/emails',{
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body: JSON.stringify({
      to: document.getElementById('to').value,
      subject: document.getElementById('subject').value
    })
  });
  load();
}
async function load(){
  let res = await fetch('http://localhost:4000/emails');
  let data = await res.json();
  document.getElementById('list').innerHTML = data.map(e=>`<p>${e.to} - ${e.subject}</p>`).join('');
}
load();
</script>
