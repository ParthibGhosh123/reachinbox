<!DOCTYPE html>
<html>
<head><title>Schedule Email</title></head>
<body style="font-family: sans-serif; padding: 30px;">
<h2>Schedule Email</h2>
To: <br><input id="to" value="test@test.com" style="width:300px;padding:8px"><br><br>
From: <br><input id="from" value="me@test.com" style="width:300px;padding:8px"><br><br>
Subject: <br><input id="subject" value="Hello" style="width:300px;padding:8px"><br><br>
Body: <br><textarea id="body" style="width:300px;height:80px;padding:8px">Test email</textarea><br><br>
Time: <br><input type="datetime-local" id="time" style="padding:8px"><br><br>
<button onclick="send()" style="padding:10px 20px;background:blue;color:white;border:none;cursor:pointer">Schedule</button>
<p id="result" style="color:green;font-weight:bold"></p>

<script>
async function send(){
  let t = document.getElementById('time').value;
  if(!t){ alert('Age Time dao! Calendar icon e click kore time select koro'); return; }
  let time = t.replace('T',' ') + ':00';
  document.getElementById('result').innerText = 'Sending...';
  try{
    let res = await fetch('http://localhost:4000/api/emails/schedule', {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({
        to: document.getElementById('to').value,
        from: document.getElementById('from').value,
        subject: document.getElementById('subject').value,
        body: document.getElementById('body').value,
        scheduledAt: time
      })
    });
    let data = await res.text();
    document.getElementById('result').innerText = 'Done: ' + data;
  }catch(e){
    document.getElementById('result').innerText = 'Error: Server cholche na! Terminal e npm run dev koro';
  }
}
</script>
</body>
</html>
